name: 自动编译生成 BikeLocker APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装并配置官方 Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: 编译生成 Debug 安装包 (免签名，手机直接安装)
        run: gradle assembleDebug --stacktrace

      - name: 上传 APK 安装包供直接下载
        uses: actions/upload-artifact@v4
        with:
          name: BikeLocker-App-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
